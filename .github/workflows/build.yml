name: Build Flash Boot Tool
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Setup Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: "3.11"

    - name: Install backend deps
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build backend.exe
      working-directory: ./backend
      run: pyinstaller --onefile --name backend main.py

    - name: Verify backend.exe
      shell: cmd
      run: |
        if not exist backend\dist\backend.exe (
          echo backend.exe not found!
          exit 1
        )
        dir backend\dist

    - name: Setup Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: "20"

    - name: Install frontend deps
      working-directory: ./frontend
      run: npm install

    - name: Build React
      working-directory: ./frontend
      run: npm run build

    - name: Create frontend resources folder
      shell: cmd
      run: mkdir frontend\resources

    - name: Copy backend.exe to frontend resources
      shell: cmd
      run: |
        mkdir frontend\resources\backend
        copy backend\dist\backend.exe frontend\resources\backend\backend.exe

    - name: Copy ventoy resources
      shell: cmd
      run: xcopy backend\flash_tool\resources\ventoy frontend\resources\ventoy /E /I /Y

    - name: Build Electron
      working-directory: ./frontend
      run: npm run dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: Flash-Boot-Tool-${{ github.run_number }}
        path: frontend/dist/*.exe
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: frontend/dist/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
