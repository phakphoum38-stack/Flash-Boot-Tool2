name: Build Flash Boot Tool

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # PYTHON BACKEND BUILD
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip

          # ❌ FIX: no plistlib (built-in, removed from requirements)
          pip install -r requirements.txt

          # install build tools
          pip install pyinstaller pywin32

      - name: Build backend.exe
        working-directory: ./backend
        run: |
          pyinstaller main.py ^
            --onefile ^
            --clean ^
            --name backend ^
            --hidden-import=pywintypes ^
            --hidden-import=win32file ^
            --hidden-import=win32api ^
            --hidden-import=winioctlcon

      # =========================
      # NODE / FRONTEND BUILD
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install

      - name: Build React
        working-directory: ./frontend
        run: npm run build

      # =========================
      # PACKAGE BACKEND INTO FRONTEND
      # =========================
      - name: Prepare resources
        working-directory: ./frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/backend
          New-Item -ItemType Directory -Force resources/ventoy

      - name: Copy backend.exe
        shell: pwsh
        run: |
          if (Test-Path backend\dist\backend.exe) {
            Copy-Item backend\dist\backend.exe frontend\resources\backend\backend.exe
          } else {
            Write-Error "backend.exe not found"
            exit 1
          }

      # =========================
      # ELECTRON BUILD
      # =========================
      - name: Build Electron Windows
        working-directory: ./frontend
        run: npm run dist

      # =========================
      # ARTIFACT
      # =========================
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flash-Boot-Tool-win-${{ github.run_number }}
          path: frontend/dist/*.exe
          if-no-files-found: error

  # =========================
  # MAC BUILD (CLEANED)
  # =========================
  build-mac:
    runs-on: macos-latest
    needs: build-win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm install

      - name: Build React
        working-directory: ./frontend
        run: npm run build

      - name: Build Electron Mac
        working-directory: ./frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --mac

      - name: Package Mac output
        working-directory: ./frontend/dist
        run: |
          mkdir -p package
          cp *.dmg package/ || true

          hdiutil makehybrid \
            -o Flash-Boot-Tool-mac.iso \
            package \
            -hfs \
            -hfs-volume-name "FlashBoot"

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flash-Boot-Tool-mac-${{ github.run_number }}
          path: frontend/dist/*
