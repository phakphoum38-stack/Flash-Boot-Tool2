name: Build Flash Boot Tool
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-win:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.0

    - name: Setup Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: "3.11"

    - name: Install backend deps
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build backend.exe
      working-directory: ./backend
      run: pyinstaller --onefile --name backend main.py

    - name: Verify backend.exe
      shell: cmd
      run: |
        if not exist backend\dist\backend.exe ( 
          echo backend.exe not found! 
          exit 1 
        )
        dir backend\dist

    - name: Setup Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: "24"

    - name: Install frontend deps
      working-directory: ./frontend
      run: npm install

    - name: Build React
      working-directory: ./frontend
      run: npm run build

    - name: Prepare frontend resources
      working-directory: ./frontend
      shell: cmd
      run: |
        mkdir resources
        mkdir resources\backend
        mkdir resources\ventoy

    - name: Copy backend.exe to frontend resources
      working-directory: ./frontend
      shell: cmd
      run: copy ..\backend\dist\backend.exe resources\backend\backend.exe

    - name: Copy ventoy resources
      working-directory: ./frontend
      shell: cmd
      run: |
        if exist ..\backend\flash_tool\resources\ventoy (
          xcopy ..\backend\flash_tool\resources\ventoy resources\ventoy /E /I /Y
        ) else (
          echo ERROR: ventoy folder not found at backend\flash_tool\resources\ventoy
          exit 1
        )

    - name: Verify resources copied
      working-directory: ./frontend
      shell: cmd
      run: |
        if not exist resources\backend\backend.exe (
          echo backend.exe copy failed!
          exit 1
        )
        dir resources /s

    - name: Build Electron Windows
      working-directory: ./frontend
      run: npm run dist

    - name: Build Electron Mac
      working-directory: ./frontend
      run: npm run dist --mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Create ISO with DMG inside
      working-directory: ./frontend/dist
      shell: cmd
      run: |
        for %%f in (*.dmg) do set DMG_FILE=%%f
        mkdir iso_content
        copy "%DMG_FILE%" iso_content\
        
        powershell -Command "New-PSDrive -Name 'ISO' -PSProvider 'ISOFile' -Root '%CD%\iso_content' -ErrorAction SilentlyContinue"
        powershell -Command "oscdimg -u2 -m -h -j1 -lFLASHBOOT iso_content FLASH-Boot-Tool-mac.iso"
        
        dir *.iso

    - name: Prepare Windows USB Package
      shell: cmd
      run: |
        mkdir usb_package
        copy frontend\dist\*.exe usb_package\
        copy frontend\dist\*.iso usb_package\
        
        echo Flash Boot Tool > usb_package\README.txt
        echo. >> usb_package\README.txt
        echo 1. ไฟล์ Flash-Boot-Tool-win-xxx.exe = ติดตั้งบน Windows >> usb_package\README.txt
        echo 2. ไฟล์ Flash-Boot-Tool-mac.iso = แตกไฟล์ด้วย 7zip หรือเอาไปใช้บน Mac >> usb_package\README.txt
        echo 3. ใช้ Rufus หรือ BalenaEtcher แฟลชไฟล์ .iso ลง USB ถ้าต้องการ >> usb_package\README.txt
        
        powershell Compress-Archive -Path usb_package\* -DestinationPath Flash-Boot-Tool-USB-Package.zip

    - name: Upload USB Package Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: Flash-Boot-Tool-USB-Package-${{ github.run_number }}
        path: Flash-Boot-Tool-USB-Package.zip
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          frontend/dist/*.exe
          frontend/dist/*.iso
          Flash-Boot-Tool-USB-Package.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
