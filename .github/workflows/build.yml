name: Build Flash Boot Tool
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.0

    - name: Setup Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: "3.11"

    - name: Install backend deps
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build backend.exe
      working-directory: ./backend
      run: pyinstaller --onefile --name backend main.py

    - name: Verify backend.exe
      shell: cmd
      run: |
        if not exist backend\dist\backend.exe ( 
          echo backend.exe not found! 
          exit 1 
        )
        dir backend\dist

    - name: Setup Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: "24"

    - name: Install frontend deps
      working-directory: ./frontend
      run: npm install

    - name: Build React
      working-directory: ./frontend
      run: npm run build

    - name: Prepare frontend resources
      working-directory: ./frontend
      shell: cmd
      run: |
        mkdir resources
        mkdir resources\backend
        mkdir resources\ventoy

    - name: Copy backend.exe to frontend resources
      working-directory: ./frontend
      shell: cmd
      run: copy ..\backend\dist\backend.exe resources\backend\backend.exe

    - name: List backend structure for debug
      working-directory: ./backend
      shell: cmd
      run: dir /s /b

    - name: Copy ventoy resources
      working-directory: ./frontend
      shell: cmd
      run: |
        if exist ..\backend\flash_tool\ventoy (
          xcopy ..\backend\flash_tool\ventoy resources\ventoy /E /I /Y
        ) else if exist ..\backend\flash_tool\Ventoy (
          xcopy ..\backend\flash_tool\Ventoy resources\ventoy /E /I /Y
        ) else if exist ..\backend\flash_tool\Ventoy2Disk.exe (
          copy ..\backend\flash_tool\Ventoy2Disk.exe resources\ventoy\
        ) else (
          echo Ventoy folder not found!
          exit 1
        )

    - name: Verify resources copied
      working-directory: ./frontend
      shell: cmd
      run: |
        if not exist resources\backend\backend.exe (
          echo backend.exe copy failed!
          exit 1
        )
        dir resources /s

    - name: Build Electron
      working-directory: ./frontend
      run: npm run dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: Flash-Boot-Tool-${{ github.run_number }}
        path: frontend/dist/*.exe
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: frontend/dist/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
