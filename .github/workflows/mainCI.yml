name: Build Flash

on:
push:
branches:
- main

jobs:
build:
runs-on: windows-latest

steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-node@v4
    with:
      node-version: 20
  # =========================
  # FRONTEND
  # =========================
  - name: Build frontend
    working-directory: frontend-c
    run: |
      npm install
      npm run build
  # =========================
  # ELECTRON
  # =========================
  - name: Install Electron deps
    working-directory: electron
    run: npm install
  # =========================
  # MSVC
  # =========================
  - name: Setup MSVC
    uses: ilammy/msvc-dev-cmd@v1
  # =========================
  # BUILD BACKEND
  # =========================
  - name: Build C++ backend
    working-directory: backend-cpp
    shell: cmd
    run: |
      if not exist build mkdir build
      cd build
      cmake -G "Visual Studio 17 2022" ..
      cmake --build . --config Release
  # =========================
  # DEBUG BUILD OUTPUT
  # =========================
  - name: Show backend files
    shell: powershell
    run: |
      Get-ChildItem backend-cpp/build -Recurse
  # =========================
  # COPY BACKEND EXE
  # =========================
  - name: Copy backend.exe
    shell: powershell
    run: |
      $exe = Get-ChildItem backend-cpp/build -Recurse -Filter *.exe |
             Where-Object { $_.Name -eq "backend.exe" } |
             Select-Object -First 1
      if (-not $exe) {
        Write-Error "backend.exe not found"
        exit 1
      }
      New-Item -ItemType Directory -Force -Path "electron/resources/backend"
      Copy-Item $exe.FullName `
                "electron/resources/backend/backend.exe"
  # =========================
  # COPY FRONTEND DIST
  # =========================
  - name: Copy frontend build
    shell: powershell
    run: |
      New-Item -ItemType Directory -Force -Path "electron/frontend"
      Copy-Item "frontend-c/dist/*" `
                "electron/frontend/" `
                -Recurse -Force
  # =========================
  # BUILD ELECTRON
  # =========================
  - name: Build Electron
    working-directory: electron
    run: npm run dist
  # =========================
  # ARTIFACT
  # =========================
  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: flash-tool
      path: electron/dist/**
