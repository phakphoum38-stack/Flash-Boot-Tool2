name: Build Flash

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend-c
        run: |
          npm install
          npm run build

      - name: Install Electron deps
        working-directory: electron
        run: |
          npm install

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ backend
        working-directory: backend-cpp
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" ..
          cmake --build . --config Release

      - name: Copy backend.exe
        shell: cmd
        run: |
          if not exist electron\resources\backend mkdir electron\resources\backend
          copy backend-cpp\build\Release\backend.exe electron\resources\backend\backend.exe

      - name: Build Electron
        working-directory: electron
        run: npm run dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-tool
          path: |
            frontend-c/dist/**
            backend-cpp/build/Release/**
            electron/dist/**
